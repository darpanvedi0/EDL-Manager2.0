; Loaded after php.ini-production.

expose_php = Off
date.timezone = ${TZ:-UTC}

; The app prints an HTML comment before sending redirects and session cookies;
; the production default of 4096 is what keeps those headers working.
output_buffering = 4096

session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
; Set EDL_SECURE_COOKIES=1 once the UI is served over HTTPS.
session.cookie_secure = ${EDL_SECURE_COOKIES:-0}
