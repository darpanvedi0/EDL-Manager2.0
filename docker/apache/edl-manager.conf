# Apache site for the EDL Manager container. Apache runs as www-data on 8080.

ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:8080>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Users and password hashes, the audit log, TLS private keys, and
    # server-side code are never served.
    <DirectoryMatch "^/var/www/html/(data|config|includes)(/|$)">
        Require all denied
    </DirectoryMatch>

    # These scripts have no authentication. The image leaves them out; this
    # blocks them if the source tree is mounted over /var/www/html.
    <FilesMatch "^(setup|user_setup|test_index|debug[a-z_]*)\.php$">
        Require all denied
    </FilesMatch>

    <LocationMatch "/\.">
        Require all denied
    </LocationMatch>

    # Firewalls fetch the blocklists without authentication. Serve the .txt
    # lists as plain text and nothing else.
    <Directory /var/www/html/edl-files>
        php_admin_flag engine off
        Require all denied
        <FilesMatch "\.txt$">
            Require all granted
            Header set Cache-Control "no-cache"
        </FilesMatch>
    </Directory>
    AddDefaultCharset utf-8

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
