    - contextPath: EDLManager.Entry.DeletionReason
      description: Why the entry was removed.
      type: String
  - name: edl-manager-entry-remove
    description: Removes an entry from the blocklist and republishes the list. The record is kept with status deleted. The API key needs the remove permission.
    execution: true
    arguments:
    - name: entry_id
      required: true
      description: The blocklist entry ID.
    - name: reason
      description: Why the entry is removed.
    outputs:
    - contextPath: EDLManager.Entry.ID
      description: The blocklist entry ID.
      type: String
