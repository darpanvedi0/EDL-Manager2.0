    - contextPath: EDLManager.Metrics.TimeToEnforcement.Count
      description: Approvals measured for time until a firewall fetched the updated list.
      type: Number
    - contextPath: EDLManager.Metrics.TimeToEnforcement.MedianSeconds
      description: Median time from approval until a firewall first fetched the updated list, in seconds.
      type: Number
    - contextPath: EDLManager.Metrics.TimeToEnforcement.P90Seconds
      description: 90th percentile time from approval until a firewall first fetched the updated list, in seconds.
      type: Number
    - contextPath: EDLManager.Metrics.TimeToEnforcement.Coverage
      description: Share of approvals in the window that could be measured (fetch tracking was running).
      type: Number
    - contextPath: EDLManager.Metrics.RequestToEnforcement.Count
      description: Requests measured from submission until a firewall fetched the updated list.
      type: Number
    - contextPath: EDLManager.Metrics.RequestToEnforcement.MedianSeconds
      description: Median time from request until a firewall first fetched the updated list, in seconds.
