  - name: edl-manager-metrics-get
    description: 'Gets impact metrics: time from request to approval, time until a firewall pulls the updated list, and which firewall clients are polling. The API key needs the view permission.'
    arguments:
    - name: days
      description: The size of the window, ending now, in days (1-3650).
      defaultValue: '30'
    outputs:
    - contextPath: EDLManager.Metrics.GeneratedAt
      description: When the metrics were computed.
      type: Date
    - contextPath: EDLManager.Metrics.Window.Days
      description: The size of the window, in days.
      type: Number
    - contextPath: EDLManager.Metrics.Window.From
      description: Start of the window.
